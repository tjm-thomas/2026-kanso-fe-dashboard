services:
  fe-dashboard:
    build:
      context: .
      args:
        VERSION: ${KANSO_VERSION:-dev}
    image: kanso-fe-dashboard:dev
    container_name: kanso-fe-dashboard
    ports:
      - "${KANSO_PORT:-8089}:80"
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 and nginx listens on IPv4 only
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks: [kanso]
    configs:
      - source: nginx-conf
        target: /etc/nginx/conf.d/default.conf

# Shared with the be-main compose project, which runs the backend as kanso-be-main
networks:
  kanso:
    name: kanso

# nginx.conf plus an /api proxy to the backend. On the cluster the ingress routes /api instead,
# so this lives here and not in nginx.conf. Keep the /dashboard locations in sync with nginx.conf.
configs:
  nginx-conf:
    content: |
      server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;
          absolute_redirect off;

          location = /dashboard { return 301 /dashboard/; }

          location /dashboard/ {
              add_header Cache-Control "no-cache";
              try_files $$uri $$uri/ /dashboard/index.html;
          }

          location /dashboard/assets/ {
              add_header Cache-Control "public, max-age=31536000, immutable";
          }

          location = /healthz {
              access_log off;
              return 200 "ok\n";
          }

          # Resolve the backend per request via Docker's DNS, so nginx starts even when it is down
          location /api/ {
              resolver 127.0.0.11 valid=10s;
              set $$backend http://kanso-be-main:8080;
              proxy_pass $$backend;
          }
      }
