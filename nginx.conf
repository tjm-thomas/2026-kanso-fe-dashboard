server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Redirect to a path, not http://host:80/..., so it works behind the ingress on port 8081
    absolute_redirect off;

    # The platform routes /dashboard here without stripping the prefix
    location = /dashboard { return 301 /dashboard/; }

    # index.html and version.txt: re-checked on every load, so a deploy shows at once
    location /dashboard/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /dashboard/index.html;
    }

    # Built JS/CSS have a content hash in their names, so they can be cached for good
    location /dashboard/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
